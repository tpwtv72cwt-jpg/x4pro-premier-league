name: Update wallpaper

on:
  schedule:
    # Every hour at :13. Off the hour to dodge the congestion GitHub sees at
    # :00, which delays scheduled runs.
    - cron: "13 * * * *"
  workflow_dispatch:

# A slow run must never overlap the next tick and fight over the commit.
concurrency:
  group: update-wallpaper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render the wallpaper
        run: python generate_wallpaper.py -o PremierLeague.bmp --tz Asia/Kolkata

      - name: Commit only when the image actually changed
        run: |
          if git diff --quiet -- PremierLeague.bmp; then
            echo "No change this hour — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PremierLeague.bmp
          git commit -m "chore: refresh Premier League wallpaper"
          git push
